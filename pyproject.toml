[project]
name = "oktalib"
version = "3.0.0"
description = "A library to interface with Okta through it's restful api"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    {name = "oktalib", email = "ctyfoxylos@schubergphilis.com"},
]
requires-python = ">=3.12"
dependencies = [
    "backoff>=2.2.1",
    "cachetools>=7.0.1",
    "python-dateutil>=2.9.0.post0",
    "requests>=2.32.5",
]
classifiers = [
    # Python versions supported by the package
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]

# click is a transient dependency, but broken beyond version 8.2.1
# so this is needed until the following issue is fixed:
# https://github.com/mkdocs/mkdocs/issues/4032
[dependency-groups]
dev = [
    "betamax>=0.9.0",
    "click<=8.2.1",
    "mkdocs==1.6.1",
    "mkdocstrings[python]==0.30.1",
    "mypy==1.18.2",
    "pylint>=4.0.4",
    "pytest>=9.0.2",
    "ruff==0.13.1",
    "types-cachetools>=6.2.0.20251022",
    "types-python-dateutil>=2.9.0.20260124",
    "types-requests>=2.32.4.20260107",
]

[build-system]
requires = ["uv_build>=0.8.15,<0.10.0"]
build-backend = "uv_build"

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]
# Recommended ignore list for preventing clashes between ruff lint and ruff format.
ignore = [
    # indentation-with-invalid-multiple
    "E111",
    # indentation-with-invalid-multiple-comment
    "E114",
    # over-indented
    "E117",
]

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
files = ["src/"]
disallow_untyped_defs = true

[tool.pylint.'MAIN']
disable = [
    "locally-disabled",
    "logging-format-interpolation",
    "logging-fstring-interpolation"
]

[tool.pylint.'FORMAT']
max-line-length = 100

[tool.pylint.'DESIGN']
# API wrapper classes naturally have many methods and arguments
max-args = 8
max-positional-arguments = 8
max-public-methods = 50
max-attributes = 15
# Large entity modules are acceptable for API wrappers
max-module-lines = 2000

[tool.pylint.'SIMILARITIES']
# Ignore duplicate boilerplate code (author headers, etc.)
min-similarity-lines = 10

[tool.pylint.'MESSAGES CONTROL']
# Disable specific checks that are acceptable in this codebase
disable = [
    "protected-access"  # W0212: Internal API calls within the library
]

[tool.pylint.'BASIC']
# Tests don't need docstrings
no-docstring-rgx = "^test_"

[tool.pylint.'TYPECHECK']
# Allow accessing protected members within the same package
ignored-classes = ["Okta"]
# betamax/adapter.py:105 - since betamax isn't actively maintained, it uses datetime.utcnow() which is deprecated in Python 3.11+. Suppress the warning for now.
[tool.pytest.ini_options]
filterwarnings = [
    "ignore:datetime.datetime.utcnow\\(\\) is deprecated:DeprecationWarning:betamax.adapter",
]
